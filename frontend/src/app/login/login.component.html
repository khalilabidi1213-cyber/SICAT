<!-- src/app/login/login.component.html -->
<div class="d-flex justify-content-center align-items-center vh-100 login-backdrop">
  <div class="card access-card shadow-2xl">
    <div class="card-body p-4 p-sm-5">

      <!-- Brand & Header -->
      <div class="text-center mb-4">
        <div class="brand-badge-icon mb-2">
          <i class="bi bi-shield-shaded text-cyan"></i>
        </div>
        <h3 class="card-title mb-1 font-display">
          <span class="text-cyan glow-cyan">SICAT</span>
        </h3>
        <span class="access-sub font-mono">SECURE TACTICAL OPERATIONS TERMINAL</span>
      </div>

      <form (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="username" class="form-label font-mono">OPERATOR CALLSIGN / USERNAME</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person-fill text-cyan"></i></span>
            <input type="text" id="username" name="username" class="form-control font-mono" autocomplete="username"
              [(ngModel)]="username" required>
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label font-mono">ENCRYPTED CREDENTIAL / PASSWORD</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-shield-lock-fill text-cyan"></i></span>
            <input type="password" id="password" name="password" class="form-control font-mono"
              autocomplete="current-password" [(ngModel)]="password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 font-mono fw-bold py-2 mb-3">
          <i class="bi bi-box-arrow-in-right me-1"></i>
          <span>AUTHENTICATE & ENTER C2</span>
        </button>

        <div class="connection-status d-flex align-items-center justify-content-center gap-2 font-mono">
          <span class="pulse-dot"></span>
          <span>ENCRYPTED LINK // DEFCON 2 READY</span>
        </div>
      </form>
    </div>
  </div>
</div>
